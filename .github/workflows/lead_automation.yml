name: Beetles Lead Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Harvester
        run: python harvest_leads.py
      - name: Commit Updated Queue
        run: |
          git config --global user.name "Beetles-Bot"
          git config --global user.email "bot@beetles.ai"
          git add lead_queue.json
          git commit -m "Automated daily lead queue update" || exit 0
          git push